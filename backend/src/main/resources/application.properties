# ==========================================================================
# Shree Associates Backend - application.properties
#
# Every secret below is read from an environment variable placeholder
# (${VAR_NAME:default}). Set the real values as environment variables (or in
# a local, git-ignored .env file loaded by your shell / IDE) - never edit
# real credentials into this file and never commit them to source control.
# ==========================================================================

spring.application.name=shree-associates-backend
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------
# Database (MySQL). Enquiries are always stored, even if WhatsApp fails.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shree_associates?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Tanvi9903@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update" is convenient for local development (auto-creates/updates the
# enquiries table from the entity). For production, prefer "validate" and
# manage schema changes explicitly via database/schema.sql - see README.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# Dialect is intentionally left unset - Hibernate 6 auto-detects it from the
# JDBC connection (MySQL here, H2 in tests). Hardcoding it caused the test
# profile's dialect override to conflict with this one, silently breaking
# schema creation for tests.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------
# WhatsApp Business Cloud API (Meta Graph API)
# See README.md -> "WhatsApp Business Cloud API Setup" for how to obtain
# each of these values, and how to create/approve the message template.
# ---------------------------------------------------------------------
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.recipient-number=${WHATSAPP_RECIPIENT_NUMBER:}
whatsapp.api-version=${WHATSAPP_API_VERSION:v20.0}
whatsapp.template-name=${WHATSAPP_TEMPLATE_NAME:website_enquiry_notification}
whatsapp.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:en}
# true = send via the approved message template (required by Meta in most cases).
# false = send a free-form text message (only works inside a 24h customer-service session).
whatsapp.use-template=${WHATSAPP_USE_TEMPLATE:true}

# ---------------------------------------------------------------------
# CORS - comma-separated list of allowed frontend origins.
# During local development this matches a simple static server (e.g. VS
# Code "Live Server" / `python -m http.server`) serving the frontend folder.
# Replace with the real production domain before deploying, e.g.
# https://www.shreeassociates.com
# ---------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501}

# ---------------------------------------------------------------------
# Basic anti-spam rate limiting for POST /api/enquiries
# ---------------------------------------------------------------------
app.ratelimit.max-requests=${RATE_LIMIT_MAX_REQUESTS:5}
app.ratelimit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# ---------------------------------------------------------------------
# Never expose stack traces / internals in error responses
# ---------------------------------------------------------------------
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ---------------------------------------------------------------------
# Actuator - health check only, nothing sensitive exposed
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.com.shreeassociates=INFO